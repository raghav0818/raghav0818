  <!-- static line is the fallback if the animation does not play -->
  <polyline points="590,196 650,196 662,196 672,176 685,214 697,156 709,196 745,196 762,196 772,186 782,196 870,196" fill="none" stroke="#1e8a4c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="400" stroke-dashoffset="0">
