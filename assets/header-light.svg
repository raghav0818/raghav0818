<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="S.T.A.R.S. personnel file: Raghav Rajesh. Computer Science and Design at SUTD. Full-stack, cloud, hardware. AWS Certified Cloud Practitioner. Condition: Fine.">
  <rect width="900" height="230" fill="#f4f1ea"/>
  <rect width="900" height="6" fill="#a10f17"/>
